        let currentSection = null;

	let currentLanguage = localStorage.getItem('dvk_language') || 'none';

        function renderSections() {
            currentSection = null;
            currentLecture = null;
            updateBreadcrumb();
            const area = document.getElementById('contentArea');
            const names = Object.keys(physicsData);
            let html = `<div class="level-grid">`;
            names.forEach(name => {
                const count = physicsData[name].lectures ? physicsData[name].lectures.length : 0;
                html += `<button class="level-btn" onclick="renderLectures('${name}')">${name}<span class="sub">${count} лекций</span></button>`;
            });
            html += `</div>`;
            area.innerHTML = html;
        }

        function renderLectures(sectionName) {
            currentSection = sectionName;
            currentLecture = null;
            updateBreadcrumb();
            const section = physicsData[sectionName];
            if (!section || !section.lectures) { renderSections(); return; }
            const area = document.getElementById('contentArea');
            let html = `<button class="back-btn" onclick="renderSections()">← Ко всем разделам</button><div class="level-grid">`;
            section.lectures.forEach((lec, index) => {
                const count = lec.parts ? lec.parts.length : 0;
                html += `<button class="level-btn" onclick="renderParts('${sectionName}', ${index})">${lec.title}<span class="sub">${count} частей</span></button>`;
            });
            html += `</div>`;
            area.innerHTML = html;
        }

        function renderParts(sectionName, lectureIndex) {
            currentSection = sectionName;
            currentLecture = lectureIndex;
            updateBreadcrumb();
            const section = physicsData[sectionName];
            if (!section || !section.lectures || !section.lectures[lectureIndex]) { renderSections(); return; }
            const lecture = section.lectures[lectureIndex];
            const area = document.getElementById('contentArea');
            let html = `<button class="back-btn" onclick="renderLectures('${sectionName}')">← К списку лекций</button>`;
            html += `<h2 style="color:#90b0f0; margin-bottom:16px; font-size:24px;">${lecture.title}</h2><div class="parts-list">`;
            if (lecture.parts && lecture.parts.length > 0) {
                lecture.parts.forEach(part => {
   			 // Берём ссылку для текущего языка
    			let videoUrl = '';
   			 if (part.urls && part.urls[currentLanguage]) {
      			  videoUrl = part.urls[currentLanguage];
  			  } else if (part.url) {
      			  // Совместимость со старой структурой
      			  videoUrl = part.url;
   			 }
    
   			 const disabled = !videoUrl || videoUrl.includes('ССЫЛКА');
    			html += `<div class="part-item"><span class="name">${part.name}</span><a href="${videoUrl}" target="_blank" class="lecture-link ${disabled ? 'disabled' : ''}">▶ Смотреть</a></div>`;
		});
            } else {
                html += `<div class="empty-msg">📭 В этой лекции пока нет частей.</div>`;
            }
            html += `</div>`;
            area.innerHTML = html;
        }

        function updateBreadcrumb() {
            const crumbSection = document.getElementById('crumbSection');
            const crumbLecture = document.getElementById('crumbLecture');
            const crumbSep = document.getElementById('crumbSep');
            if (currentSection) {
                crumbSection.style.display = 'inline';
                crumbSection.textContent = currentSection;
                crumbSection.className = 'crumb-link';
                crumbSection.onclick = () => renderLectures(currentSection);
                if (currentLecture !== null) {
                    crumbSep.style.display = 'inline';
                    const lec = physicsData[currentSection].lectures[currentLecture];
                    crumbLecture.style.display = 'inline';
                    crumbLecture.textContent = lec ? lec.title : '...';
                    crumbLecture.className = '';
                } else {
                    crumbSep.style.display = 'none';
                    crumbLecture.style.display = 'none';
                }
            } else {
                crumbSection.style.display = 'none';
                crumbSep.style.display = 'none';
                crumbLecture.style.display = 'none';
            }
        }

        function goToSections() { renderSections(); }
// ===== ВЫБОР ЯЗЫКА =====
function selectLanguage(lang) {
    // Сохраняем выбор языка
    localStorage.setItem('dvk_language', lang);
    
    // Сохраняем позицию (если мы внутри лекции)
    if (currentSection !== null) {
        localStorage.setItem('dvk_last_section', currentSection);
        if (currentLecture !== null) {
            localStorage.setItem('dvk_last_lecture', currentLecture);
        } else {
            localStorage.removeItem('dvk_last_lecture');
        }
    } else {
        localStorage.removeItem('dvk_last_section');
        localStorage.removeItem('dvk_last_lecture');
    }
    
    // Показываем уведомление
    const names = {
        'none': 'Без субтитров',
        'ru': 'Русские субтитры',
        'en': 'English subtitles',
        'uz': 'O\'zbek subtitrlari'
    };
    showToast(`✅ Выбран режим: ${names[lang]}`);
    
    // Перезагружаем страницу через 0,5 сек
    setTimeout(() => {
        location.reload();
    }, 1500);//время перед обновлением страницы 1500миллисекунд=1,5секунды
}
// ===== АВТОМАТИЧЕСКИЙ ВЫБОР ПРИ ПОВТОРНОМ ВИЗИТЕ =====
window.addEventListener('DOMContentLoaded', () => {
    const savedLang = localStorage.getItem('dvk_language');
    
    if (savedLang) {
        // Язык уже выбран ранее — скрываем экран выбора
        currentLanguage = savedLang;
        document.getElementById('languageScreen').style.display = 'none';
        
        // Восстанавливаем позицию
        const lastSection = localStorage.getItem('dvk_last_section');
        const lastLecture = localStorage.getItem('dvk_last_lecture');
        
        if (lastSection) {
            currentSection = lastSection;
            if (lastLecture !== null) {
                currentLecture = parseInt(lastLecture);
                renderParts(lastSection, currentLecture);
            } else {
                renderLectures(lastSection);
            }
        } else {
            renderSections();
        }
    } else {
        // Первый заход — показываем экран выбора
        document.getElementById('languageScreen').style.display = 'flex';
    }
});
// ===== ВОЗВРАТ К ЭКРАНУ ВЫБОРА ЯЗЫКА =====
function showLanguageScreen() {
    document.getElementById('languageScreen').style.display = 'flex';
}
// ============================================================
// ФУНКЦИЯ УВЕДОМЛЕНИЙ (TOAST)
// ============================================================
function showToast(msg) {
    const el = document.getElementById('toastMessage');
    if (!el) return;
    el.textContent = msg;
    el.style.opacity = '1';
    el.style.transform = 'translateX(-50%) translateY(0px)';
    clearTimeout(el._timer);
    el._timer = setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(-50%) translateY(20px)';
    }, 4000);//время показа объявления 4000 миллисекунд=4секунды
}
