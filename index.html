        // ============================================================
        // 2.  ЛОГИКА НАВИГАЦИИ
        // ============================================================
        let currentSection = null;
        let currentLecture = null;

        function renderSections() {
            currentSection = null;
            currentLecture = null;
            updateBreadcrumb();
            const area = document.getElementById('contentArea');
            const names = Object.keys(physicsData);
            let html = `<div class="level-grid">`;
            names.forEach(name => {
                const count = physicsData[name].lectures ? physicsData[name].lectures.length : 0;
                html += `<button class="level-btn" onclick="renderLectures('${name}')">${name}<span class="sub">${count} лекций</span></button>`;
            });
            html += `</div>`;
            area.innerHTML = html;
        }

        function renderLectures(sectionName) {
            currentSection = sectionName;
            currentLecture = null;
            updateBreadcrumb();
            const section = physicsData[sectionName];
            if (!section || !section.lectures) { renderSections(); return; }
            const area = document.getElementById('contentArea');
            let html = `<button class="back-btn" onclick="renderSections()">← Ко всем разделам</button><div class="level-grid">`;
            section.lectures.forEach((lec, index) => {
                const count = lec.parts ? lec.parts.length : 0;
                html += `<button class="level-btn" onclick="renderParts('${sectionName}', ${index})">${lec.title}<span class="sub">${count} частей</span></button>`;
            });
            html += `</div>`;
            area.innerHTML = html;
        }

        function renderParts(sectionName, lectureIndex) {
            currentSection = sectionName;
            currentLecture = lectureIndex;
            updateBreadcrumb();
            const section = physicsData[sectionName];
            if (!section || !section.lectures || !section.lectures[lectureIndex]) { renderSections(); return; }
            const lecture = section.lectures[lectureIndex];
            const area = document.getElementById('contentArea');
            let html = `<button class="back-btn" onclick="renderLectures('${sectionName}')">← К списку лекций</button>`;
            html += `<h2 style="color:#90b0f0; margin-bottom:16px; font-size:24px;">${lecture.title}</h2><div class="parts-list">`;
            if (lecture.parts && lecture.parts.length > 0) {
                lecture.parts.forEach(part => {
                    const disabled = !part.url || part.url.includes('ССЫЛКА');
                    html += `<div class="part-item"><span class="name">${part.name}</span><a href="${part.url}" target="_blank" class="lecture-link ${disabled ? 'disabled' : ''}">▶ Смотреть</a></div>`;
                });
            } else {
                html += `<div class="empty-msg">📭 В этой лекции пока нет частей.</div>`;
            }
            html += `</div>`;
            area.innerHTML = html;
        }

        function updateBreadcrumb() {
            const crumbSection = document.getElementById('crumbSection');
            const crumbLecture = document.getElementById('crumbLecture');
            const crumbSep = document.getElementById('crumbSep');
            if (currentSection) {
                crumbSection.style.display = 'inline';
                crumbSection.textContent = currentSection;
                crumbSection.className = 'crumb-link';
                crumbSection.onclick = () => renderLectures(currentSection);
                if (currentLecture !== null) {
                    crumbSep.style.display = 'inline';
                    const lec = physicsData[currentSection].lectures[currentLecture];
                    crumbLecture.style.display = 'inline';
                    crumbLecture.textContent = lec ? lec.title : '...';
                    crumbLecture.className = '';
                } else {
                    crumbSep.style.display = 'none';
                    crumbLecture.style.display = 'none';
                }
            } else {
                crumbSection.style.display = 'none';
                crumbSep.style.display = 'none';
                crumbLecture.style.display = 'none';
            }
        }

        function goToSections() { renderSections(); }

        // ============================================================
        // 3.  ЗАПУСК
        // ============================================================
        renderSections();
    </script>
